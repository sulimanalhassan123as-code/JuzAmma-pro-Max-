// Top-level build file
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
    }
}

apply plugin: 'com.android.application'

android {
    namespace 'com.suleiman.juzammapromax'
    compileSdk 36

    defaultConfig {
        applicationId "com.suleiman.juzammapromax"
        minSdk 24
        targetSdk 36
        versionCode 16
        versionName "16.0.0"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            def props = new Properties()
            def f = new File('../apk-release/keystore.properties')
            if (f.exists()) props.load(new FileInputStream(f))
            storeFile file(props['storeFile'] ?: '../apk-release/keystore/juzamma-release.keystore')
            storePassword props['storePassword'] ?: ''
            keyAlias props['keyAlias'] ?: 'juzamma'
            keyPassword props['keyPassword'] ?: ''
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.firebase:firebase-messaging:24.1.0'
}
