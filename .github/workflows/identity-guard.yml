name: Identity and Scope Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  identity:
    name: Identity and Scope Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify every commit against the registry (REST API, not git ranges)
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 .github/scripts/identity_check.py

      - name: Reject signing material
        run: |
          bad=$(git ls-files | grep -Ei '\.(jks|keystore|p12|pfx)$|(^|/)(local\.properties|keystore\.properties)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Signing material must never be committed:"
            echo "$bad"
            exit 1
          fi
          echo "PASS - no signing material tracked"
